# Every fault type once, for a combined demonstration run.
schema_version: 1
run: {mode: sim, seed: 7, duration_s: 70}
estimator: {pos_noise_m: 0.5, vel_noise_mps: 0.05, att_noise_rad: 0.01}  # EKF2-like, plain GNSS
faults:
  - {type: link, start_s: 8, duration_s: 6, direction: both, p_good_to_bad: 0.02,
     p_bad_to_good: 0.2, loss_bad: 1.0, delay_ms: 20, jitter_ms: 15, byte_error_rate: 0.001}
  - {type: estimator_freeze, start_s: 16, duration_s: 4}
  - {type: gnss, kind: jump, start_s: 24, duration_s: 4, offset_m: [15, -5, 0]}
  - {type: clock_fault, start_s: 30, duration_s: 30, drift_ppm: 300}
  - {type: fc_reboot, start_s: 62, boot_ms: 3000}
client:
  - {kind: command, at_s: 3, cmd: arm}
  - {kind: setpoints, start_s: 3.5, end_s: 60, rate_hz: 20, frame: velocity, value: [2, 0, -0.5]}
  - {kind: command, at_s: 4, cmd: offboard}
  - {kind: timesync, start_s: 1, end_s: 69, rate_hz: 1}
