# F7: the autopilot leaves OFFBOARD on its own while setpoints keep streaming:
# here the pilot flips the RC mode switch at 30 s (any failsafe of the autopilot
# looks the same: cause low_battery or geofence, target hold). OFFBOARD is
# refused until 40 s; the onboard computer asks again at 45 s.
schema_version: 1
run: {mode: sim, seed: 7, duration_s: 60}
estimator: {pos_noise_m: 0.5, vel_noise_mps: 0.05, att_noise_rad: 0.01}  # EKF2-like, plain GNSS
faults:
  - {type: mode_override, start_s: 30, duration_s: 10, to: manual, cause: rc_override}
client:
  - {kind: command, at_s: 3, cmd: arm}
  - {kind: setpoints, start_s: 3.5, end_s: 58, rate_hz: 20, frame: velocity, value: [2, 0, -0.5]}
  - {kind: command, at_s: 4, cmd: offboard}
  - {kind: command, at_s: 35, cmd: offboard}
  - {kind: command, at_s: 45, cmd: offboard}
